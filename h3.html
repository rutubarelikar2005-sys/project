<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
    <style>
        body { font-family: Arial; background: lightblue; }
        input, button { margin: 5px; padding: 5px; }
    </style>
</head>
<body>

<h1>Student Result</h1>

Name: <input id="name"><br>
English: <input id="m1" type="number"><br>
Maths: <input id="m2" type="number"><br>
Science: <input id="m3" type="number"><br>

<button onclick="result()">Calculate Result</button>

<p id="output"></p>

<script>
function result() {
    let a = Number(document.getElementById("m1").value);
    let b = Number(document.getElementById("m2").value);
    let c = Number(document.getElementById("m3").value);

    let total = a + b + c;
    let per = total / 3;

    document.getElementById("output").innerHTML =
        "Name: " + document.getElementById("name").value +
        "<br>Total: " + total +
        "<br>Percentage: " + per.toFixed(2) + "%";
}
</script>

</body>
</html>
