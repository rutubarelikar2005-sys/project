<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
    <style>
        body { font-family: Arial; background: lightblue; }
        input, button { margin: 9px; padding: 6px; }
    </style>
</head>
<body>

<h1>Marks Calculator</h1>

Subject 1: <input type="number" id="a"><br>
Subject 2: <input type="number" id="b"><br>
Subject 3: <input type="number" id="c"><br>

<button onclick="calculate()">Calculate</button>

<p id="result"></p>

<script>
function calculate() {
    let total = Number(a.value) + Number(b.value) + Number(c.value);
    let per = total / 3;

    document.getElementById("result").innerHTML =
        "Total Marks: " + total +
        "<br>Percentage: " + per.toFixed(2) + "%";
}
</script>

</body>
</html>
